<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read a student discussion on CampusTalk.">
  <title>Discussion — CampusTalk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/discussion-detail.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Campus<span class="brand-accent">Talk</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link active" href="discussions.html">Discussions</a>
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="profile.html">My profile</a>
          <a class="btn btn-primary btn-sm px-3 ms-lg-2" href="create-post.html">Create post</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container detail-container py-4 py-lg-5">
    <a class="back-link text-decoration-none" href="discussions.html">← Back to discussions</a>
    <div id="detailStatus" class="alert alert-light border mt-4" role="status" aria-live="polite">Loading discussion…</div>
    <article id="discussionDetail" class="detail-card mt-3 d-none" aria-live="polite">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <span class="badge rounded-pill detail-category" id="postCategory">General</span>
        <time class="detail-date" id="postDate"></time>
      </div>
      <h1 class="display-6 fw-bold mb-3" id="postTitle"></h1>
      <div class="detail-author d-flex align-items-center gap-3 mb-4">
        <span class="detail-avatar" id="authorInitial">S</span>
        <div><div class="fw-semibold" id="authorName">Student</div><div class="small text-secondary">Discussion author</div></div>
      </div>
      <div class="detail-divider"></div>
      <div class="discussion-content" id="postContent"></div>
      <div class="detail-footer d-flex flex-wrap justify-content-between align-items-center gap-3 mt-5">
        <span class="small text-secondary" id="updatedDate"></span>
        <a class="btn btn-outline-primary btn-sm" href="discussions.html">Explore more discussions</a>
      </div>
    </article>
    <div id="detailActions" class="d-none mt-4">
      <a class="btn btn-primary" href="discussions.html">Browse discussions</a>
      <a class="btn btn-outline-secondary ms-2" href="index.html">Home</a>
    </div>
  </main>

  <footer class="border-top py-4"><div class="container d-flex flex-wrap justify-content-between gap-2 small text-secondary"><span>© <span id="year"></span> CampusTalk Student Discussion Forum</span><a class="text-decoration-none" href="index.html">Back to home</a></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/discussion-detail.js"></script>
</body>
</html>
