<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View your CampusTalk student profile.">
  <title>My profile — CampusTalk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="auth-page">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Campus<span class="brand-accent">Talk</span></a>
      <div class="d-flex align-items-center gap-3">
        <a class="small text-decoration-none" href="dashboard.html">Dashboard</a>
        <button class="btn btn-outline-secondary btn-sm" id="logoutButton" type="button">Log out</button>
      </div>
    </div>
  </nav>

  <main class="container auth-container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="profile-card">
          <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
            <div class="profile-avatar" id="profileInitials">CT</div>
            <div>
              <span class="eyebrow">YOUR ACCOUNT</span>
              <h1 class="h2 fw-bold mt-1 mb-0">My profile</h1>
              <p class="text-secondary mb-0">Your CampusTalk account information.</p>
            </div>
          </div>
          <div id="profileMessage" class="alert alert-light" role="status" aria-live="polite">Loading your profile…</div>
          <dl class="profile-details">
            <div><dt>Full name</dt><dd id="profileName">—</dd></div>
            <div><dt>Email address</dt><dd id="profileEmail">—</dd></div>
            <div><dt>Account role</dt><dd id="profileRole">—</dd></div>
            <div><dt>Account status</dt><dd id="profileStatus">—</dd></div>
          </dl>
          <div class="d-flex flex-wrap gap-2 mt-4">
            <a href="dashboard.html" class="btn btn-primary">Go to dashboard</a>
            <button class="btn btn-outline-secondary" id="profileLogoutButton" type="button">Log out</button>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
