<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in to your CampusTalk student account.">
  <title>Login — CampusTalk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Campus<span class="brand-accent">Talk</span></a>
      <a class="small text-decoration-none" href="index.html">Back to home</a>
    </div>
  </nav>
  <main class="container auth-container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <section class="auth-card">
          <div class="auth-mark">CT</div>
          <span class="eyebrow">WELCOME BACK</span>
          <h1 class="h2 fw-bold mt-2">Log in to CampusTalk</h1>
          <p class="text-secondary mb-4">Continue learning and sharing with your student community.</p>

          <div id="loginMessage" class="alert d-none" role="alert" aria-live="polite"></div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="email">Email address</label>
              <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="you@example.com" required>
              <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold" for="password">Password</label>
              <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
              <div class="invalid-feedback">Enter your password.</div>
            </div>
            <button class="btn btn-primary btn-lg w-100" id="loginButton" type="submit">Log in</button>
          </form>
          <p class="small text-secondary text-center mt-4 mb-0">New to CampusTalk? <a href="register.html">Create an account</a></p>
        </section>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
